model:
  name: unsloth/gemma-4-E2B-it
  load_in_4bit: false
  chat_template: gemma-4

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0

  use_rslora: false
  random_state: 3407
  
sft:
  epochs: 1
  batch_size: 1
  gradient_steps: 4

  warmup_ratio: 0.03
  max_grad_norm: 0.3

  learning_rate: 2.0e-4
  lr_scheduler_type: cosine

  seed: 3407
  optim: adamw_8bit
  weight_decay: 0.001
  
  steps: 500 
  strategy: steps
  output_dir: checkpoints
